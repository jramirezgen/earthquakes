language: r
dist: bionic
r: "4.3.1"
pandoc_version: 2.19.2
cache: packages
repos:
  CRAN: https://packagemanager.posit.co/cran/__linux__/bionic/2023-10-01
apt_packages:
  - qpdf
  - libuv1-dev
  - libcurl4-openssl-dev
  - libssl-dev
  - libxml2-dev
  - libfreetype6-dev
  - libpng-dev
  - libharfbuzz-dev
  - libfribidi-dev
  - libjpeg-dev
  - libtiff5-dev
  - tidy
warnings_are_errors: true
before_install:
  - echo 'options(HTTPUserAgent = sprintf("R/%s R (%s)", getRversion(), paste(getRversion(), R.version$platform, R.version$arch, R.version$os)))' >> ~/.Rprofile
env:
  global:
    - _R_CHECK_FUTURE_FILE_TIMESTAMPS_=false
